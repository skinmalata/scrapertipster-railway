<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up - WinFulltime</title>
<link rel="icon" type="image/png" href="/winfulltimelogo.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', sans-serif; background: #0c0f1a; color: #e2e8f0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.auth-container { width: 100%; max-width: 420px; padding: 24px; }
.logo { text-align: center; margin-bottom: 32px; }
.logo img { height: 48px; }
.logo h1 { font-size: 22px; font-weight: 800; margin-top: 8px; background: linear-gradient(135deg, #ff2448, #d41a38); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.auth-card { background: rgba(13,17,32,0.95); border: 1px solid rgba(255,255,255,0.06); border-radius: 16px; padding: 32px; }
.auth-card h2 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
.auth-card .subtitle { color: #94a3b8; font-size: 14px; margin-bottom: 24px; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 13px; font-weight: 600; color: #94a3b8; margin-bottom: 6px; }
.form-group input { width: 100%; padding: 10px 14px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; color: #e2e8f0; font-size: 14px; font-family: inherit; outline: none; transition: border-color 0.2s; }
.form-group input:focus { border-color: #ff2448; }
.form-group .error { color: #ff2448; font-size: 12px; margin-top: 4px; display: none; }
.btn-primary { width: 100%; padding: 12px; background: linear-gradient(135deg, #ff2448, #d41a38); border: none; border-radius: 10px; color: white; font-size: 15px; font-weight: 700; font-family: inherit; cursor: pointer; transition: opacity 0.2s; }
.btn-primary:hover { opacity: 0.9; }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-google { width: 100%; padding: 12px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; color: #e2e8f0; font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 12px; transition: background 0.2s; }
.btn-google:hover { background: rgba(255,255,255,0.08); }
.divider { display: flex; align-items: center; gap: 12px; margin: 20px 0; color: #4a5568; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
.divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.06); }
.auth-footer { text-align: center; margin-top: 20px; font-size: 14px; color: #94a3b8; }
.auth-footer a { color: #ff2448; text-decoration: none; font-weight: 600; }
.auth-footer a:hover { text-decoration: underline; }
.alert { padding: 12px 16px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; display: none; }
.alert-error { background: rgba(255,36,72,0.1); border: 1px solid rgba(255,36,72,0.2); color: #ff6b6b; display: block; }
.alert-success { background: rgba(72,187,120,0.1); border: 1px solid rgba(72,187,120,0.2); color: #68d391; display: block; }
.password-hint { font-size: 12px; color: #4a5568; margin-top: 4px; }
.confirmation-sent { text-align: center; padding: 40px 20px; }
.confirmation-sent .icon { font-size: 48px; margin-bottom: 16px; }
.confirmation-sent h3 { font-size: 18px; margin-bottom: 8px; }
.confirmation-sent p { color: #94a3b8; font-size: 14px; line-height: 1.5; }
.spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.6s linear infinite; vertical-align: middle; margin-right: 6px; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="auth-container">
  <div class="logo">
    <img src="/winfulltimelogo.png" alt="WinFulltime">
    <h1>WinFulltime</h1>
  </div>
  <div class="auth-card" id="signup-form">
    <h2>Create Account</h2>
    <p class="subtitle">Get started with your free account</p>
    <div id="alert" class="alert"></div>
    <div id="confirmation" class="confirmation-sent" style="display:none">
      <div class="icon">&#9993;</div>
      <h3>Check your email</h3>
      <p>We sent a confirmation link to <strong id="confirmation-email"></strong>. Click the link to activate your account.</p>
    </div>
    <div id="form-fields">
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" placeholder="Your full name" autocomplete="name">
        <div class="error" id="name-error"></div>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
        <div class="error" id="email-error"></div>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="At least 6 characters" autocomplete="new-password">
        <div class="password-hint">Must be at least 6 characters</div>
        <div class="error" id="password-error"></div>
      </div>
      <button class="btn-primary" id="signup-btn" onclick="handleSignUp()">Create Account</button>
      <div class="divider">or</div>
      <button class="btn-google" onclick="handleGoogleSignUp()">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Continue with Google
      </button>
    </div>
  </div>
  <div class="auth-footer">
    Already have an account? <a href="/login.html">Sign in</a>
  </div>
</div>
<script src="/config.js"></script>
<script src="/supabase-client.js"></script>
<script>
var SUBMIT_TIMEOUT = null;

function showAlert(msg, type) {
  var el = document.getElementById('alert');
  el.textContent = msg;
  el.className = 'alert alert-' + type;
}

function clearErrors() {
  document.querySelectorAll('.error').forEach(function(e) { e.style.display = 'none'; });
  document.getElementById('alert').className = 'alert';
}

function setLoading(loading) {
  var btn = document.getElementById('signup-btn');
  if (loading) {
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Creating account...';
  } else {
    btn.disabled = false;
    btn.innerHTML = 'Create Account';
  }
}

function handleSignUp() {
  if (SUBMIT_TIMEOUT) return;
  clearErrors();

  var fullName = document.getElementById('fullName').value.trim();
  var email = document.getElementById('email').value.trim();
  var password = document.getElementById('password').value;

  if (!fullName) { document.getElementById('name-error').textContent = 'Name is required'; document.getElementById('name-error').style.display = 'block'; return; }
  if (!email) { document.getElementById('email-error').textContent = 'Email is required'; document.getElementById('email-error').style.display = 'block'; return; }
  if (password.length < 6) { document.getElementById('password-error').textContent = 'Must be at least 6 characters'; document.getElementById('password-error').style.display = 'block'; return; }

  setLoading(true);
  SUBMIT_TIMEOUT = setTimeout(function() { SUBMIT_TIMEOUT = null; }, 5000);

  var ready = function () {
    if (!window.WFT || !window.WFT.supabase) {
      showAlert('Auth service loading. Please try again.', 'error');
      setLoading(false); SUBMIT_TIMEOUT = null;
      return;
    }

    window.WFT.supabase.auth.signUp({
      email: email,
      password: password,
      options: { data: { full_name: fullName } }
    }).then(function (result) {
      setLoading(false); SUBMIT_TIMEOUT = null;
      if (result.error) {
        showAlert(result.error.message, 'error');
      } else if (result.data.user && result.data.user.identities && result.data.user.identities.length === 0) {
        showAlert('An account with this email already exists.', 'error');
      } else {
        document.getElementById('confirmation-email').textContent = email;
        document.getElementById('confirmation').style.display = 'block';
        document.getElementById('form-fields').style.display = 'none';
      }
    }).catch(function (err) {
      setLoading(false); SUBMIT_TIMEOUT = null;
      showAlert(err.message || 'An unexpected error occurred', 'error');
    });
  };

  if (window.WFT && window.WFT.supabase) { ready(); return; }
  document.addEventListener('wft-supabase-ready', ready);
  setTimeout(function() { if (SUBMIT_TIMEOUT) { setLoading(false); SUBMIT_TIMEOUT = null; showAlert('Auth service timed out. Please refresh.', 'error'); } }, 8000);
}

function handleGoogleSignUp() {
  if (!window.WFT || !window.WFT.supabase) {
    showAlert('Auth service loading. Please try again.', 'error');
    return;
  }
  window.WFT.supabase.auth.signInWithOAuth({ provider: 'google' });
}
</script>
</body>
</html>
