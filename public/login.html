<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - ScraperTipster</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-container {
      background: #1e1e2f;
      padding: 40px;
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    h1 { color: #fff; text-align: center; margin-bottom: 30px; font-size: 28px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; color: #aaa; margin-bottom: 8px; font-size: 14px; }
    input {
      width: 100%;
      padding: 14px;
      border: 2px solid #2a2a4a;
      border-radius: 8px;
      background: #252540;
      color: #fff;
      font-size: 16px;
      transition: border-color 0.3s;
    }
    input:focus { outline: none; border-color: #4f46e5; }
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
      margin-bottom: 10px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      color: #fff;
    }
    .btn-primary:hover { transform: translateY(-2px); }
    .btn-secondary {
      background: #2a2a4a;
      color: #aaa;
    }
    .btn-secondary:hover { background: #3a3a5a; }
    .btn-google {
      background: #fff;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .btn-google:hover { background: #f0f0f0; }
    .btn-google img { width: 20px; height: 20px; }
    .divider {
      text-align: center;
      color: #666;
      margin: 20px 0;
      position: relative;
    }
    .divider::before, .divider::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 40%;
      height: 1px;
      background: #2a2a4a;
    }
    .divider::before { left: 0; }
    .divider::after { right: 0; }
    .error { color: #ef4444; text-align: center; margin-bottom: 15px; display: none; }
    .success { color: #22c55e; text-align: center; margin-bottom: 15px; display: none; }
    .switch-mode {
      text-align: center;
      margin-top: 20px;
      color: #aaa;
      font-size: 14px;
    }
    .switch-mode a { color: #6366f1; text-decoration: none; }
    .forgot-password {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
    }
    .forgot-password a { color: #6366f1; text-decoration: none; }
  </style>
</head>
<body>
  <div class="login-container">
    <h1>Login</h1>
    <div class="error" id="error"></div>
    <div class="success" id="success"></div>
    
    <button type="button" class="btn btn-google" id="googleBtn" onclick="handleGoogleLogin()">
      <img src="https://www.google.com/favicon.ico" alt="Google" onerror="this.style.display='none'">
      Continue with Google
    </button>
    
    <div class="divider">or</div>
    
    <form id="loginForm">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" required placeholder="Enter your email">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" required placeholder="Enter your password">
      </div>
      <button type="submit" class="btn btn-primary">Login</button>
      <button type="button" class="btn btn-secondary" onclick="switchMode('register')">Create Account</button>
    </form>
    <div class="forgot-password">
      <a href="/reset-password.html">Forgot Password?</a>
    </div>
    <div class="switch-mode">
      <a href="/">Back to Home</a>
    </div>
  </div>

  <script>
    const GOOGLE_CLIENT_ID = 'YOUR_GOOGLE_CLIENT_ID';
    const REDIRECT_URI = window.location.origin + '/auth/google/callback';

    function handleGoogleLogin() {
      if (GOOGLE_CLIENT_ID === 'YOUR_GOOGLE_CLIENT_ID') {
        document.getElementById('error').textContent = 'Google login not configured. Please use email login.';
        document.getElementById('error').style.display = 'block';
        return;
      }
      const authUrl = 'https://accounts.google.com/o/oauth2/v2/auth?' + 
        'client_id=' + GOOGLE_CLIENT_ID +
        '&redirect_uri=' + encodeURIComponent(REDIRECT_URI) +
        '&response_type=code' +
        '&scope=openid email profile' +
        '&prompt=select_account';
      window.location.href = authUrl;
    }

    if (window.location.pathname === '/auth/google/callback') {
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get('code');
      if (code) {
        fetch('/api/auth/google', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code })
        }).then(res => res.json()).then(data => {
          if (data.success) {
            localStorage.setItem('user', JSON.stringify(data.user));
            window.location.href = '/';
          } else {
            window.location.href = '/login.html?error=google_auth_failed';
          }
        });
      }
    }

    const urlParams = new URLSearchParams(window.location.search);
    const isRegister = urlParams.get('mode') === 'register';
    if (isRegister) {
      document.querySelector('h1').textContent = 'Create Account';
      document.querySelector('.btn-primary').textContent = 'Register';
      document.querySelector('.btn-secondary').textContent = 'Back to Login';
      document.getElementById('success').textContent = 'Account created! Please login.';
      document.getElementById('success').style.display = 'block';
    }
    
    if (urlParams.get('error') === 'google_auth_failed') {
      document.getElementById('error').textContent = 'Google authentication failed. Please try again.';
      document.getElementById('error').style.display = 'block';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('error');
      const isRegisterMode = document.querySelector('.btn-primary').textContent === 'Register';

      errorEl.style.display = 'none';

      try {
        const endpoint = isRegisterMode ? '/api/register' : '/api/login';
        const apiUrl = window.location.origin + endpoint;
        const res = await fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (!res.ok) {
          errorEl.textContent = data.message || 'An error occurred';
          errorEl.style.display = 'block';
          console.error('Auth error:', data);
          return;
        }

        if (isRegisterMode) {
          alert('Account created successfully! Please login.');
          window.location.href = '/login.html';
        } else {
          localStorage.setItem('user', JSON.stringify(data.user));
          window.location.href = '/';
        }
      } catch (err) {
        errorEl.textContent = 'Network error: ' + err.message;
        errorEl.style.display = 'block';
        console.error('Network error:', err);
      }
    });

    document.querySelector('.btn-secondary').addEventListener('click', () => {
      const isRegisterMode = document.querySelector('.btn-primary').textContent === 'Register';
      if (isRegisterMode) {
        window.location.href = '/login.html';
      } else {
        window.location.href = '/login.html?mode=register';
      }
    });
  </script>
</body>
</html>
