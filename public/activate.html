<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activate Account - ScraperTipster</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: #1e1e2f;
      padding: 40px;
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    h1 { color: #fff; margin-bottom: 20px; }
    p { color: #aaa; margin-bottom: 20px; line-height: 1.6; }
    .btn {
      display: inline-block;
      padding: 14px 30px;
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
    }
    .btn:hover { transform: translateY(-2px); }
    .success { color: #22c55e; }
    .error { color: #ef4444; }
    .loading { color: #6366f1; }
  </style>
</head>
<body>
  <div class="container">
    <h1 id="title">Activating Account...</h1>
    <p id="message">Please wait while we activate your account.</p>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    const email = urlParams.get('email');

    async function activate() {
      if (!token || !email) {
        document.getElementById('title').textContent = 'Invalid Link';
        document.getElementById('title').className = 'error';
        document.getElementById('message').textContent = 'The activation link is invalid. Please register again.';
        return;
      }

      try {
        const res = await fetch(window.location.origin + '/api/activate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, email })
        });
        const data = await res.json();

        if (res.ok) {
          document.getElementById('title').textContent = 'Account Activated!';
          document.getElementById('title').className = 'success';
          document.getElementById('message').innerHTML = 'Your account has been activated successfully!<br><br><a href="/login.html" class="btn">Login Now</a>';
        } else {
          document.getElementById('title').textContent = 'Activation Failed';
          document.getElementById('title').className = 'error';
          document.getElementById('message').textContent = data.message || 'Could not activate account.';
        }
      } catch (err) {
        document.getElementById('title').textContent = 'Error';
        document.getElementById('title').className = 'error';
        document.getElementById('message').textContent = 'Network error. Please try again.';
      }
    }

    activate();
  </script>
</body>
</html>
