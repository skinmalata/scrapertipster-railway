<style>
  :root { --bg:#0d1117; --bg-card:#161b22; --border:#232a33; --text-primary:#f0f3f8; --text-secondary:#9aa4b2; --accent:#2AD572; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text-primary); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; min-height:100vh; display:flex; flex-direction:column; }

  header .dot { width:10px; height:10px; border-radius:50%; background:var(--accent); display:inline-block; }
  main { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:48px 20px; }
  h1 { font-size:64px; margin:0; color:var(--accent); }
  h2 { font-size:24px; margin:16px 0 8px; }
  p { color:var(--text-secondary); max-width:520px; line-height:1.6; }
  .links { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-top:24px; }
  .links a { background:var(--bg-card); border:1px solid var(--border); color:var(--text-primary); text-decoration:none; padding:10px 16px; border-radius:10px; font-size:14px; font-weight:600; }
  .links a:hover { border-color:var(--accent); }
  .ctx { margin-top:24px; color:var(--text-secondary); font-size:13px; }
  footer { padding:18px 24px; border-top:1px solid var(--border); color:var(--text-secondary); font-size:13px; text-align:center; }
  footer a { color:var(--text-secondary); }

</head>

<script>
  try {
    var p = location.pathname;
    var ctx = document.getElementById('ctx');
    if (/^\/teams\//.test(p)) {
      ctx.textContent = 'Looking for a team profile? It may have been renamed — search the site or browse all predictions.';
    } else if (/^\/h2h\//.test(p)) {
      ctx.textContent = 'Looking for a head-to-head page? The fixture may no longer be scheduled — browse current match predictions instead.';

</script>
