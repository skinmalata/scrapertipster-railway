<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - ScraperTipster</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: #1e1e2f;
      padding: 40px;
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    h1 { color: #fff; text-align: center; margin-bottom: 30px; font-size: 24px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; color: #aaa; margin-bottom: 8px; font-size: 14px; }
    input {
      width: 100%;
      padding: 14px;
      border: 2px solid #2a2a4a;
      border-radius: 8px;
      background: #252540;
      color: #fff;
      font-size: 16px;
    }
    input:focus { outline: none; border-color: #4f46e5; }
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 10px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      color: #fff;
    }
    .btn-secondary {
      background: #2a2a4a;
      color: #aaa;
    }
    .error { color: #ef4444; text-align: center; margin-bottom: 15px; display: none; }
    .success { color: #22c55e; text-align: center; margin-bottom: 15px; display: none; }
    .switch-mode { text-align: center; margin-top: 20px; color: #aaa; font-size: 14px; }
    .switch-mode a { color: #6366f1; text-decoration: none; }
  </style>
</head>
<body>
  <div class="container" id="requestContainer">
    <h1>Reset Password</h1>
    <div class="error" id="error"></div>
    <div class="success" id="success"></div>
    <form id="requestForm">
      <div class="form-group">
        <label>Enter your email</label>
        <input type="email" id="email" required placeholder="your@email.com">
      </div>
      <button type="submit" class="btn btn-primary">Send Reset Link</button>
      <div class="switch-mode">
        <a href="/login.html">Back to Login</a>
      </div>
    </form>
  </div>

  <div class="container" id="resetContainer" style="display: none;">
    <h1>New Password</h1>
    <div class="error" id="error2"></div>
    <div class="success" id="success2"></div>
    <form id="resetForm">
      <input type="hidden" id="token">
      <div class="form-group">
        <label>New Password</label>
        <input type="password" id="newPassword" required placeholder="New password">
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" id="confirmPassword" required placeholder="Confirm password">
      </div>
      <button type="submit" class="btn btn-primary">Reset Password</button>
    </form>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const resetToken = urlParams.get('token');

    if (resetToken) {
      document.getElementById('requestContainer').style.display = 'none';
      document.getElementById('resetContainer').style.display = 'block';
      document.getElementById('token').value = resetToken;
    }

    document.getElementById('requestForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const errorEl = document.getElementById('error');
      const successEl = document.getElementById('success');
      errorEl.style.display = 'none';
      successEl.style.display = 'none';

      try {
        const res = await fetch(window.location.origin + '/api/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();
        
        if (!res.ok) {
          errorEl.textContent = data.message || 'Error sending reset email';
          errorEl.style.display = 'block';
          return;
        }
        
        successEl.textContent = 'If that email exists, a reset link has been sent.';
        successEl.style.display = 'block';
      } catch (err) {
        errorEl.textContent = 'Network error. Please try again.';
        errorEl.style.display = 'block';
      }
    });

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const token = document.getElementById('token').value;
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const errorEl = document.getElementById('error2');
      const successEl = document.getElementById('success2');
      errorEl.style.display = 'none';
      successEl.style.display = 'none';

      if (newPassword !== confirmPassword) {
        errorEl.textContent = 'Passwords do not match';
        errorEl.style.display = 'block';
        return;
      }

      try {
        const res = await fetch(window.location.origin + '/api/reset-password/confirm', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword })
        });
        const data = await res.json();
        
        if (!res.ok) {
          errorEl.textContent = data.message || 'Error resetting password';
          errorEl.style.display = 'block';
          return;
        }
        
        successEl.textContent = 'Password reset successful! Redirecting...';
        successEl.style.display = 'block';
        setTimeout(() => window.location.href = '/login.html', 2000);
      } catch (err) {
        errorEl.textContent = 'Network error. Please try again.';
        errorEl.style.display = 'block';
      }
    });
  </script>
</body>
</html>
