<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password - WinFulltime</title>
<link rel="icon" type="image/png" href="/winfulltimelogo.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', sans-serif; background: #0c0f1a; color: #e2e8f0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.auth-container { width: 100%; max-width: 420px; padding: 24px; }
.logo { text-align: center; margin-bottom: 32px; }
.logo img { height: 48px; }
.logo h1 { font-size: 22px; font-weight: 800; margin-top: 8px; background: linear-gradient(135deg, #ff2448, #d41a38); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.auth-card { background: rgba(13,17,32,0.95); border: 1px solid rgba(255,255,255,0.06); border-radius: 16px; padding: 32px; }
.auth-card h2 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
.auth-card .subtitle { color: #94a3b8; font-size: 14px; margin-bottom: 24px; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 13px; font-weight: 600; color: #94a3b8; margin-bottom: 6px; }
.form-group input { width: 100%; padding: 10px 14px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; color: #e2e8f0; font-size: 14px; font-family: inherit; outline: none; transition: border-color 0.2s; }
.form-group input:focus { border-color: #ff2448; }
.btn-primary { width: 100%; padding: 12px; background: linear-gradient(135deg, #ff2448, #d41a38); border: none; border-radius: 10px; color: white; font-size: 15px; font-weight: 700; font-family: inherit; cursor: pointer; transition: opacity 0.2s; }
.btn-primary:hover { opacity: 0.9; }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
.auth-footer { text-align: center; margin-top: 20px; font-size: 14px; color: #94a3b8; }
.auth-footer a { color: #ff2448; text-decoration: none; font-weight: 600; }
.auth-footer a:hover { text-decoration: underline; }
.alert { padding: 12px 16px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; display: none; }
.alert-error { background: rgba(255,36,72,0.1); border: 1px solid rgba(255,36,72,0.2); color: #ff6b6b; display: block; }
.alert-success { background: rgba(72,187,120,0.1); border: 1px solid rgba(72,187,120,0.2); color: #68d391; display: block; }
.spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.6s linear infinite; vertical-align: middle; margin-right: 6px; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="auth-container">
  <div class="logo">
    <img src="/winfulltimelogo.png" alt="WinFulltime">
    <h1>WinFulltime</h1>
  </div>
  <div class="auth-card">
    <div id="request-view">
      <h2>Reset Password</h2>
      <p class="subtitle">Enter your email and we'll send a recovery link</p>
      <div id="alert" class="alert"></div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
      </div>
      <button class="btn-primary" id="reset-btn" onclick="handleResetRequest()">Send Recovery Link</button>
      <div class="auth-footer" style="margin-top:16px"><a href="/login.html">Back to sign in</a></div>
    </div>
    <div id="update-view" style="display:none">
      <h2>Set New Password</h2>
      <p class="subtitle">Choose a new password for your account</p>
      <div id="update-alert" class="alert"></div>
      <div class="form-group">
        <label for="new-password">New Password</label>
        <input type="password" id="new-password" placeholder="At least 6 characters" autocomplete="new-password">
      </div>
      <button class="btn-primary" id="update-btn" onclick="handlePasswordUpdate()">Update Password</button>
    </div>
  </div>
</div>
<script src="/config.js"></script>
<script src="/supabase-client.js"></script>
<script>
var isRecovery = window.location.hash && window.location.hash.includes('type=recovery');

function showAlert(msg, type) {
  var el = document.getElementById('alert');
  el.textContent = msg;
  el.className = 'alert alert-' + type;
}

function showUpdateAlert(msg, type) {
  var el = document.getElementById('update-alert');
  el.textContent = msg;
  el.className = 'alert alert-' + type;
}

function setLoading(loading) {
  var btn = document.getElementById('reset-btn');
  btn.disabled = loading;
  btn.innerHTML = loading ? '<span class="spinner"></span>Sending...' : 'Send Recovery Link';
}

function handleResetRequest() {
  var email = document.getElementById('email').value.trim();
  if (!email) { showAlert('Please enter your email', 'error'); return; }
  setLoading(true);

  var ready = function () {
    if (!window.WFT || !window.WFT.supabase) {
      showAlert('Auth service loading. Please try again.', 'error');
      setLoading(false); return;
    }

    window.WFT.supabase.auth.resetPasswordForEmail(email, {
      redirectTo: 'https://winfulltime.com/reset-password.html'
    }).then(function (result) {
      setLoading(false);
      if (result.error) {
        showAlert(result.error.message, 'error');
      } else {
        showAlert('Check your email for the recovery link', 'success');
      }
    });
  };

  if (window.WFT && window.WFT.supabase) { ready(); return; }
  document.addEventListener('wft-supabase-ready', ready);
}

function handlePasswordUpdate() {
  var password = document.getElementById('new-password').value;
  if (password.length < 6) { showUpdateAlert('Must be at least 6 characters', 'error'); return; }

  var btn = document.getElementById('update-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Updating...';

  var ready = function () {
    if (!window.WFT || !window.WFT.supabase) {
      showUpdateAlert('Auth service loading. Please try again.', 'error');
      btn.disabled = false; btn.innerHTML = 'Update Password'; return;
    }

    window.WFT.supabase.auth.updateUser({ password: password })
      .then(function (result) {
        btn.disabled = false; btn.innerHTML = 'Update Password';
        if (result.error) {
          showUpdateAlert(result.error.message, 'error');
        } else {
          showUpdateAlert('Password updated! Redirecting...', 'success');
          setTimeout(function() { window.location.href = '/login.html'; }, 2000);
        }
      });
  };

  if (window.WFT && window.WFT.supabase) { ready(); return; }
  document.addEventListener('wft-supabase-ready', ready);
}

if (isRecovery) {
  document.getElementById('request-view').style.display = 'none';
  document.getElementById('update-view').style.display = 'block';
}
</script>
</body>
</html>
