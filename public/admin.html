<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - ScraperTipster</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { color: #fff; margin-bottom: 30px; }
    .login-box {
      background: #1e1e2f;
      padding: 40px;
      border-radius: 16px;
      max-width: 400px;
      margin: 100px auto;
    }
    .form-group { margin-bottom: 20px; }
    label { display: block; color: #aaa; margin-bottom: 8px; }
    input {
      width: 100%;
      padding: 14px;
      border: 2px solid #2a2a4a;
      border-radius: 8px;
      background: #252540;
      color: #fff;
      font-size: 16px;
    }
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      color: #fff;
    }
    .error { color: #ef4444; text-align: center; margin-bottom: 15px; display: none; }
    .users-table {
      width: 100%;
      border-collapse: collapse;
      background: #1e1e2f;
      border-radius: 12px;
      overflow: hidden;
    }
    .users-table th, .users-table td {
      padding: 15px;
      text-align: left;
      color: #fff;
    }
    .users-table th { background: #2a2a4a; }
    .users-table tr:nth-child(even) { background: #252540; }
    .btn-delete {
      background: #ef4444;
      color: white;
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-delete:hover { background: #dc2626; }
    .nav { margin-bottom: 30px; }
    .nav a { color: #6366f1; text-decoration: none; margin-right: 20px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
    .stat-card {
      background: #1e1e2f;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
    }
    .stat-value { font-size: 32px; color: #6366f1; font-weight: bold; }
    .stat-label { color: #aaa; margin-top: 8px; }
  </style>
</head>
<body>
  <div id="loginSection" class="login-box">
    <h1 style="text-align: center;">Admin Login</h1>
    <div class="error" id="error"></div>
    <form id="loginForm">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" required>
      </div>
      <button type="submit" class="btn">Login</button>
    </form>
    <div style="text-align: center; margin-top: 20px;">
      <a href="/" style="color: #6366f1;">Back to Home</a>
    </div>
  </div>

  <div id="adminSection" class="container" style="display: none;">
    <div class="header">
      <div class="nav">
        <a href="/">Home</a>
        <a href="#" onclick="logout()">Logout</a>
      </div>
      <h1>Admin Dashboard</h1>
    </div>

    <div class="stats">
      <div class="stat-card">
        <div class="stat-value" id="totalUsers">0</div>
        <div class="stat-label">Total Users</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="totalPredictions">0</div>
        <div class="stat-label">Total Predictions</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="streakViews">0</div>
        <div class="stat-label">Streak Access Today</div>
      </div>
    </div>

    <h2 style="color: #fff; margin-bottom: 20px;">Users</h2>
    <table class="users-table">
      <thead>
        <tr>
          <th>Email</th>
          <th>Role</th>
          <th>Created</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="usersList"></tbody>
    </table>
  </div>

  <script>
    const ADMIN_EMAIL = 'admin@scrapertipster.com';

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('error');

      try {
        const res = await fetch(window.location.origin + '/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (!res.ok) {
          errorEl.textContent = data.message || 'Login failed';
          errorEl.style.display = 'block';
          return;
        }

        localStorage.setItem('adminUser', JSON.stringify(data.user));
        showAdmin();
      } catch (err) {
        errorEl.textContent = 'Network error';
        errorEl.style.display = 'block';
      }
    });

    function showAdmin() {
      document.getElementById('loginSection').style.display = 'none';
      document.getElementById('adminSection').style.display = 'block';
      loadUsers();
    }

    async function loadUsers() {
      try {
        const res = await fetch(window.location.origin + '/api/admin/users', {
          headers: { 'Authorization': ADMIN_EMAIL }
        });
        const data = await res.json();
        
        if (!res.ok) {
          alert(data.message);
          logout();
          return;
        }

        document.getElementById('totalUsers').textContent = data.users.length;
        document.getElementById('usersList').innerHTML = data.users.map(user => `
          <tr>
            <td>${user.email}</td>
            <td>${user.role}</td>
            <td>${new Date(user.createdAt).toLocaleDateString()}</td>
            <td>
              ${user.role !== 'admin' ? `<button class="btn-delete" onclick="deleteUser('${user.email}')">Delete</button>` : '-'}
            </td>
          </tr>
        `).join('');
      } catch (err) {
        console.error(err);
      }
    }

    async function deleteUser(email) {
      if (!confirm('Delete this user?')) return;
      
      try {
        const res = await fetch(window.location.origin + '/api/admin/users/' + email, {
          method: 'DELETE',
          headers: { 'Authorization': ADMIN_EMAIL }
        });
        const data = await res.json();
        
        if (res.ok) {
          loadUsers();
        } else {
          alert(data.message);
        }
      } catch (err) {
        alert('Error deleting user');
      }
    }

    function logout() {
      localStorage.removeItem('adminUser');
      document.getElementById('loginSection').style.display = 'block';
      document.getElementById('adminSection').style.display = 'none';
    }

    const adminUser = localStorage.getItem('adminUser');
    if (adminUser) {
      const user = JSON.parse(adminUser);
      if (user.role === 'admin') {
        showAdmin();
      }
    }
  </script>
</body>
</html>
