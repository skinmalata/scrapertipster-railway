services:
  - type: web
    name: winfulltime-api
    runtime: node
    buildCommand: npm ci
    startCommand: npm start
    disk:
      name: live-tip-history
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: LIVE_TIP_HISTORY_FILE
        value: /var/data/live-tip-history.json
      - key: SUPABASE_URL
        value: https://xogkqpjtxfemcxzsuwke.supabase.co
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        value: sb_publishable_VydS1cmw7_OhFa7e-xUOqQ_tcVRUQoy
      - key: ALLOWED_ORIGINS
        value: https://winfulltime.com,https://www.winfulltime.com
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: API_FOOTBALL_KEY
        sync: false
