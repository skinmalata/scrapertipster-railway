services:
  - type: web
    name: winfulltime-api
    runtime: node
    buildCommand: npm ci
    startCommand: npm start
    disk:
      name: live-tip-history
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: LIVE_TIP_HISTORY_FILE
        value: /var/data/live-tip-history.json
      - key: CONVERTER_RECENT_FILE
        value: /var/data/converter-recent.json
      - key: AUTHOR_PICKS_DATA_DIR
        value: /var/data/author-picks
      - key: SUPABASE_URL
        value: https://xogkqpjtxfemcxzsuwke.supabase.co
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        value: sb_publishable_VydS1cmw7_OhFa7e-xUOqQ_tcVRUQoy
      - key: ALLOWED_ORIGINS
        value: https://winfulltime.com,https://www.winfulltime.com
      - key: LEMONSQUEEZY_API_KEY
        sync: false
      - key: LEMONSQUEEZY_STORE_ID
        value: "441411"
      - key: LEMONSQUEEZY_WEBHOOK_SECRET
        sync: false
      - key: API_FOOTBALL_KEY
        sync: false
      - key: API_FOOTBALL_ENABLED
        value: "false"
