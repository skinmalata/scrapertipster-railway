name: Scrape & Deploy

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
    paths:
      - 'public/**'
      - 'src/templates/**'
      - 'src/services/**'
      - 'scripts/**'
      - '.github/workflows/scrape-and-deploy.yml'
  schedule:
    # 00:03 UTC (01:03 WAT) daily
    - cron: '3 0 * * *'
    # 17:00 UTC (18:00 WAT) daily: re-scrapes today/tomorrow after the source
    # site has populated fixtures and streak data, so the unbeaten section
    # never ships an empty snapshot for the day.
    - cron: '0 17 * * *'
    # Every 3 hours UTC: re-scrapes today/tomorrow, but only when the live
    # h2h-unbeaten.json still shows an empty snapshot for today (the source
    # populates fixtures/streaks gradually through the day). The preflight job
    # skips the full scrape+deploy when data is already present.
    - cron: '15 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    # Cheap gate (no checkout, no deps) that decides whether the 3-hourly cron
    # needs to run the full scrape+deploy. push / workflow_dispatch / the two
    # principal daily crons (00:03, 17:00) always run; the '15 */3 * * *' runs
    # run only when the live unbeaten snapshot for today is still empty.
    steps:
      - name: Decide whether to run
        id: decide
        run: |
          RUN="true"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            MINUTE=$(date -u +%M)
            HOUR=$(date -u +%H)
            # '15 */3 * * *' fires at minute 15 of hours 0,3,6,9,12,15,18,21 UTC
            if [ "$MINUTE" = "15" ] && [ $(( HOUR % 3 )) -eq 0 ]; then
              TODAY=$(date -u +%Y-%m-%d)
              LIVE=$(curl -fsS --max-time 20 "https://winfulltime.com/data/h2h-unbeaten.json" \
                | jq -r --arg d "$TODAY" '.dates[$d] | length // 0' 2>/dev/null || echo "0")
              echo "3-hourly run | today=$TODAY | live unmatched=$LIVE"
              if [ "$LIVE" -gt 0 ]; then
                RUN="false"
                echo "Unbeaten data already present for $TODAY; skipping re-scrape."
              fi
            fi
          fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"

  scrape:
    needs: preflight
    if: needs.preflight.outputs.run == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install system deps for Puppeteer
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libnspr4 libatk1.0-0t64 libatk-bridge2.0-0t64 \
            libcups2t64 libdrm2 libdbus-1-3 libxkbcommon0 \
            libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libpango-1.0-0 libcairo2 libasound2t64 \
            libxshmfence1

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        env:
          PUPPETEER_SKIP_DOWNLOAD: false

      - name: Run scraper
        run: node scripts/gh-pages-scraper.js

      - name: Persist analysis archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/analysis-archive.json
          if git diff --cached --quiet; then
            echo "No archive changes to commit"
          else
            git commit -m "chore: update analysis archive"
            git pull --rebase origin main || true
            git push origin main
          fi

      - name: Bake shared nav/footer layout into static pages
        run: node scripts/bake-layout.js

      - name: Emit redirect stubs for legacy/missing URLs
        run: node scripts/generate-redirects.js

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Submit changed URLs to IndexNow
        if: github.event_name == 'push'
        run: |
          if [[ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            git fetch --quiet --depth 1 origin "${{ github.event.before }}" || true
          fi
          node scripts/submit-indexnow.js
        env:
          INDEXNOW_BEFORE_SHA: ${{ github.event.before }}
          INDEXNOW_AFTER_SHA: ${{ github.sha }}
