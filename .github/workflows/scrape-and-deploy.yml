name: Scrape & Deploy

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
    paths:
      - 'public/**'
      - 'src/templates/**'
      - 'src/services/**'
      - 'scripts/**'
      - '.github/workflows/scrape-and-deploy.yml'
  schedule:
    - cron: '3 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install system deps for Puppeteer
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libnspr4 libatk1.0-0t64 libatk-bridge2.0-0t64 \
            libcups2t64 libdrm2 libdbus-1-3 libxkbcommon0 \
            libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libpango-1.0-0 libcairo2 libasound2t64 \
            libxshmfence1

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        env:
          PUPPETEER_SKIP_DOWNLOAD: false

      - name: Run scraper
        run: node scripts/gh-pages-scraper.js

      - name: Persist analysis archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/analysis-archive.json
          if git diff --cached --quiet; then
            echo "No archive changes to commit"
          else
            git commit -m "chore: update analysis archive"
            git pull --rebase origin main || true
            git push origin main
          fi

      - name: Bake shared nav/footer layout into static pages
        run: node scripts/bake-layout.js

      - name: Emit redirect stubs for legacy/missing URLs
        run: node scripts/generate-redirects.js

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Submit changed URLs to IndexNow
        if: github.event_name == 'push'
        run: |
          if [[ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            git fetch --quiet --depth 1 origin "${{ github.event.before }}" || true
          fi
          node scripts/submit-indexnow.js
        env:
          INDEXNOW_BEFORE_SHA: ${{ github.event.before }}
          INDEXNOW_AFTER_SHA: ${{ github.sha }}
