name: Daily Ticket Send

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily ticket send
        run: |
          status=$(curl -s -o /tmp/response.txt -w "%{http_code}" -X POST -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" -H "Content-Type: application/json" "${{ secrets.RENDER_URL }}/api/newsletter/daily-send")
          echo "HTTP Status: $status"
          cat /tmp/response.txt
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Request failed with status $status"
            exit 1
          fi
