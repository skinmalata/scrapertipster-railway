name: Daily Ticket Send

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily ticket send
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST -H "x-cron-secret: $CRON_SECRET" -H "Content-Type: application/json" "$RENDER_URL/api/newsletter/daily-send"
